<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
    <!-- Drone Body -->
    <rect x="7" y="7" width="6" height="6" rx="1.2" fill="currentColor"/>
    
    <!-- Drone Arms -->
    <rect x="3" y="9" width="4" height="2" rx="1" fill="currentColor"/>
    <rect x="13" y="9" width="4" height="2" rx="1" fill="currentColor"/>
    <rect x="9" y="3" width="2" height="4" rx="1" fill="currentColor"/>
    <rect x="9" y="13" width="2" height="4" rx="1" fill="currentColor"/>

    <!-- Vertical Hold Indicator -->
    <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="1.6"/>
    <polygon points="10,2 7.5,5 12.5,5" fill="currentColor"/>
    <polygon points="10,18 7.5,15 12.5,15" fill="currentColor"/>
</svg>
