<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
    <!-- Drone Body -->
    <rect x="7" y="7" width="6" height="6" rx="1.2" fill="currentColor"/>
    
    <!-- Drone Arms -->
    <rect x="3" y="9" width="4" height="2" rx="1" fill="currentColor"/>
    <rect x="13" y="9" width="4" height="2" rx="1" fill="currentColor"/>
    <rect x="9" y="3" width="2" height="4" rx="1" fill="currentColor"/>
    <rect x="9" y="13" width="2" height="4" rx="1" fill="currentColor"/>

    <!-- Crosshair -->
    <circle cx="10" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <line x1="10" y1="5.5" x2="10" y2="7.5" stroke="currentColor" stroke-width="1.4"/>
    <line x1="10" y1="12.5" x2="10" y2="14.5" stroke="currentColor" stroke-width="1.4"/>
    <line x1="5.5" y1="10" x2="7.5" y2="10" stroke="currentColor" stroke-width="1.4"/>
    <line x1="12.5" y1="10" x2="14.5" y2="10" stroke="currentColor" stroke-width="1.4"/>
</svg>
